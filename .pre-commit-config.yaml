# Pre-commit hooks for tart-msv4. Install once with `uv run pre-commit install`.
#
# When a hook modifies files, pre-commit "fails" and aborts the commit so you can review the changes.
# Run `git add -u && git commit` again.

# A plain `pre-commit install` wires both stages.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^CHANGELOG\.md$  # generated by git-cliff at release (tbump)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Conventional Commits drive the changelog, which tbump generates with git-cliff at release (cliff.toml).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, perf, docs, deps, chore, ci, style, test, build]
