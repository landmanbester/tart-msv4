name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    env:
      TART_MSV4_REQUIRE_DATA: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check the tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - uses: actions/cache@v6
        with:
          path: tests/data
          key: tart-bundle-1vENbb8wQatHCNwO6LODXgPDwchcHzo7m
      - run: uv sync --locked
      - run: uv run pytest -rs
      - run: uv build
      - run: uv publish --trusted-publishing always
