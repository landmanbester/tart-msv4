name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # Every pre-commit hook (ruff, YAML/TOML/whitespace checks), so skipping hooks locally is caught here.
      - run: uv run --only-group dev pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      TART_MSV4_REQUIRE_DATA: "1"  # real-data tests fail instead of skipping when the bundle is missing
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v6
        with:
          path: tests/data
          key: tart-bundle-1vENbb8wQatHCNwO6LODXgPDwchcHzo7m
      - run: uv sync --locked
      - run: uv run pytest -rs
